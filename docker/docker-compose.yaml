# Quill Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   QUILL_PROJECT_ROOT           — project root for relative runtime paths
#   QUILL_HOME                   — runtime data dir, default .scitops under $QUILL_PROJECT_ROOT (or cwd)
#   QUILL_CONFIG_PATH            — path to config.yaml
#   QUILL_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   QUILL_SKILLS_PATH            — skills dir, default $QUILL_PROJECT_ROOT/skills
#   QUILL_DOCKER_SOCKET          — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   QUILL_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   QUILL_INTERNAL_AUTH_TOKEN    — shared internal Gateway auth token for multi-worker IM channels
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: quill-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - quill
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: quill-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - QUILL_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - quill
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: runtime
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: quill-gateway
    # Gateway hosts the agent runtime with in-process RunManager + StreamBridge
    # singletons -- run state lives in this worker's memory. Default to a single
    # worker: with >1 worker and no nginx sticky sessions, run cancel, SSE
    # reconnect, request dedup, and per-worker IM channel services all break
    # across workers until a shared (e.g. redis) stream bridge lands, which is
    # not yet implemented. Override GATEWAY_WORKERS only once that is in place.
    command: sh -c "cd backend && QUILL_PORT=8001 node --experimental-vm-modules scripts/gateway_server.mjs"
    volumes:
      - ${QUILL_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${QUILL_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${QUILL_HOME}:/app/backend/.scitops
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/deploy.sh). See backend/docs/CONFIGURATION.md
      # Security Note section for details.
       
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    environment:
      - CI=true
      - QUILL_PROJECT_ROOT=/app
      - QUILL_HOME=/app/backend/.scitops
      - QUILL_CONFIG_PATH=/app/backend/config.yaml
      - QUILL_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - QUILL_CHANNELS_LANGGRAPH_URL=${QUILL_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - QUILL_CHANNELS_GATEWAY_URL=${QUILL_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - QUILL_INTERNAL_AUTH_TOKEN=${QUILL_INTERNAL_AUTH_TOKEN}
      # DooD path/network translation
      - QUILL_HOST_BASE_DIR=${QUILL_HOME}
      - QUILL_HOST_SKILLS_PATH=${QUILL_REPO_ROOT}/skills
      - QUILL_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quill
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: quill-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=quill
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${QUILL_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${QUILL_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quill
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  quill:
    driver: bridge
