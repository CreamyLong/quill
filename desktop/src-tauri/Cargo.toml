[package]
name = "quill-desktop"
version = "0.1.0"
description = "Quill desktop shell"
edition = "2021"

[lib]
name = "quill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
open = "5"
anyhow = "1"
sysinfo = "0.33"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
