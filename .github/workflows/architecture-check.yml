# Architecture policy enforcement.
# Inspired by ZCode's architecture-policy.yaml with automated checks.
name: Architecture Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run architecture policy check
        run: python scripts/architecture/check.py --verbose
