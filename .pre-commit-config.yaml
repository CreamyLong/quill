repos:
  # Secrets detection: prevent accidental commits of API keys / credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package-lock.json

  # Backend: eslint + tsc type-check (TypeScript runtime)
  - repo: local
    hooks:
      - id: backend-eslint
        name: eslint (backend)
        entry: bash -c 'cd backend && npx eslint --fix "${@/#backend\//}"' --
        language: system
        types_or: [ts, tsx]
        files: ^backend/

  # Frontend: eslint + prettier (must run from frontend/ for node_modules resolution)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix "${@/#frontend\//}"' --
        language: system
        types_or: [javascript, tsx, ts]
        files: ^frontend/

      - id: frontend-prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "${@/#frontend\//}"' --
        language: system
        files: ^frontend/
        types_or: [javascript, tsx, ts, json, css]
